# Auto Labeler configuration
autolabeler:
  - label: 'release/breaking'
    title:
      - '/!:/'
  - label: 'release/feature'
    title:
      - '/^feat/i'
  - label: 'release/fix'
    title:
      - '/^fix/i'
  - label: 'release/other'
    title:
      - '/^(build|chore|ci|docs|perf|refactor|revert|style|test)/i'

# Release Drafter configuration
categories:
  - title: '💥 Breaking Changes'
    label: 'release/breaking'
  - title: '🚀 Features'
    label: 'release/feature'
  - title: '🐛 Bug Fixes'
    label: 'release/fix'
  - title: '📝 Other'
    label: 'release/other'
exclude-labels:
  - 'release/skip'