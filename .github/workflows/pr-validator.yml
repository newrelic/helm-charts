name: Validate PR
on:
  pull_request:
    types: [ labeled, unlabeled ]

permissions:
  contents: read

jobs:
  validate-labels:
    name: Validate PR labels
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure exactly one chart label or 'core' is present
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          PR_LABELS=$(echo "$LABELS" | jq '[.[].name]')
          VALID_LABELS=$(yq eval -o=json 'keys' .github/chart-labels.yml | jq '. + ["core"]')

          # Remove valid labels from PR labels, then remove the result from the original PR labels to get the intersection
          MATCHED_LABELS=$(jq -n --argjson pr "$PR_LABELS" --argjson valid "$VALID_LABELS" '$pr - ($pr - $valid)')
          MATCH_COUNT=$(echo "$MATCHED_LABELS" | jq 'length')

          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "Expected exactly one chart label or 'core' to be present, found $MATCH_COUNT: $(echo "$MATCHED_LABELS" | jq -r 'join(", ")')"
            exit 1
          fi
          echo "Exactly one chart label or 'core' is present: $(echo "$MATCHED_LABELS" | jq -r '.[0]')"

      - name: Ensure exactly one change type label or 'skip-changelog' is present
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          PR_LABELS=$(echo "$LABELS" | jq '[.[].name]')
          VALID_LABELS='["type/breaking", "type/feature", "type/fix", "type/maintenance", "skip-changelog"]'

          # Remove valid labels from PR labels, then remove the result from the original PR labels to get the intersection
          MATCHED_LABELS=$(jq -n --argjson pr "$PR_LABELS" --argjson valid "$VALID_LABELS" '$pr - ($pr - $valid)')
          MATCH_COUNT=$(echo "$MATCHED_LABELS" | jq 'length')

          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "Expected exactly one of $(echo "$VALID_LABELS" | jq -r 'join(", ")') to be present, found $MATCH_COUNT: $(echo "$MATCHED_LABELS" | jq -r 'join(", ")')"
            exit 1
          fi
          echo "Exactly one change type label or 'skip-changelog' is present: $(echo "$MATCHED_LABELS" | jq -r '.[0]')"

      - name: Ensure 'do-not-merge' label is not present
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          HAS_DO_NOT_MERGE=$(echo "$LABELS" | jq 'any(.[]; .name == "do-not-merge")')

          if [ "$HAS_DO_NOT_MERGE" = "true" ]; then
            echo "'do-not-merge' label is present."
            exit 1
          fi
          echo "'do-not-merge' label is not present."
      
