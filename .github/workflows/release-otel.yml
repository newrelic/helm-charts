name: release-otel.yml
on: pull_request

jobs:
  generate-changelog-k8s-otel:
#    if: contains(needs.label-charts.outputs.changed-charts, 'nr-k8s-otel-collector')
    name: Generate changelog for nr-k8s-otel-collector
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate changelog
        id: generate-changelog
        uses: release-drafter/release-drafter@v7
        with:
          config-name: 'nr-k8s-otel-collector-release-drafter.yml'
          publish: 'false'
          dry-run: 'true'
      - name: Print changelog details
        run: |
          echo "Changelog Category: ${{ steps.generate-changelog.outputs.resolved_version }}"
          echo "Changelog Body: ${{ steps.generate-changelog.outputs.body }}"
      - name: Check for changes
        id: check-changes
        env:
          CHANGELOG_BODY: ${{ steps.generate-changelog.outputs.body }}
        run: |
          TRIMMED_CHANGELOG_BODY="${CHANGELOG_BODY%%$'\n'}"
          if [ "TRIMMED_CHANGELOG_BODY" = "* No changes" ]; then
            echo "No relevant commits since last release. Skipping release."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Relevant commits found. Proceeding with release."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi