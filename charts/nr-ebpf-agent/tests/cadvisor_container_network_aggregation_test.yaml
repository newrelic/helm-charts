suite: cadvisor container_network per-interface aggregation (LDM)
templates:
  - templates/nr-ebpf-agent-nrdot-config-pernode.yaml
release:
  name: my-release
  namespace: my-namespace

tests:
  - it: LDM on (default) defines the aggregation processor
    set: &base
      cluster: test-cluster
      licenseKey: test-license-key
    asserts:
      - matchRegex:
          path: data["pernode.yaml"]
          pattern: "metricstransform/aggregate_container_network_interfaces:"

  - it: LDM on wires the processor into the cadvisor pipeline after cumulativetodelta and before low_data_mode_inator
    set:
      <<: *base
    asserts:
      - matchRegex:
          path: data["pernode.yaml"]
          pattern: "cumulativetodelta, metricstransform/aggregate_container_network_interfaces, transform/low_data_mode_inator"

  - it: LDM on sums container_network_* across interfaces keyed by pod identity
    set:
      <<: *base
    asserts:
      - matchRegex:
          path: data["pernode.yaml"]
          pattern: "include: '\\^container_network_\\.\\*'"
      - matchRegex:
          path: data["pernode.yaml"]
          pattern: "label_set: \\[k8s\\.pod\\.name, k8s\\.namespace\\.name\\]"

  - it: LDM off retains full per-interface fidelity (aggregation absent)
    set:
      <<: *base
      nrdotCollector:
        lowDataMode: false
    asserts:
      - notMatchRegex:
          path: data["pernode.yaml"]
          pattern: "aggregate_container_network_interfaces"
