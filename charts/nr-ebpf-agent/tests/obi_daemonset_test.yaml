suite: OBI runs as its own DaemonSet, not in the agent pod
templates:
  - templates/nr-ebpf-agent-obi-daemonset.yaml
  - templates/nr-ebpf-agent-daemonset.yaml
  - templates/secrets.yaml
release:
  name: my-release
  namespace: my-namespace

tests:
  - it: is not rendered when obi is off
    set:
      cluster: test-cluster
      licenseKey: test-license-key
      ebpfAgent: {image: {tag: ""}}
      obi: {enabled: false}
    asserts:
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        hasDocuments:
          count: 0

  - it: runs privileged in the host PID and network namespaces
    set: &on
      cluster: test-cluster
      licenseKey: test-license-key
      ebpfAgent: {image: {tag: ""}}
      infra: {enabled: true}
      obi: {enabled: true}
    asserts:
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        equal:
          path: metadata.name
          value: my-release-nr-ebpf-agent-obi
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        equal:
          path: spec.template.spec.hostPID
          value: true
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        equal:
          path: spec.template.spec.hostNetwork
          value: true
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: true
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: my-release-nr-ebpf-agent

  - it: is not selected by the agent Service and keeps the label the agent's self-drop filter matches
    set:
      <<: *on
    asserts:
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        equal:
          path: spec.template.metadata.labels.component
          value: obi
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: nr-ebpf-agent
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: inherits ebpfAgent tolerations, pod securityContext and pod annotations
    set:
      <<: *on
      ebpfAgent:
        image: {tag: ""}
        tolerations:
          - {key: dedicated, operator: Exists}
        podSecurityContext: {fsGroup: 2000}
        podAnnotations: {foo: bar}
    asserts:
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        equal:
          path: spec.template.spec.tolerations
          value:
            - {key: dedicated, operator: Exists}
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        equal:
          path: spec.template.metadata.annotations.foo
          value: bar

  - it: leaves no OBI container, volume or inbound OTLP receiver in the agent pod
    set:
      <<: *on
    asserts:
      - template: templates/nr-ebpf-agent-daemonset.yaml
        lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - template: templates/nr-ebpf-agent-daemonset.yaml
        notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: bpf-fs-volume
      - template: templates/nr-ebpf-agent-daemonset.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OTLP_RECEIVER_ENABLED

  - it: exports to the per-node nrdot collector's OTLP gRPC port on loopback
    set:
      <<: *on
      nrdotCollector: {otlpReceiver: {enabled: true, grpcPort: 5317, httpPort: 5318}}
    asserts:
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://127.0.0.1:5317

  - it: fails without the per-node nrdot collector
    set:
      <<: *on
      infra: {enabled: false}
    asserts:
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        failedTemplate:
          errorPattern: needs the per-node nrdot collector

  - it: fails when the per-node collector's OTLP receiver is off
    set:
      <<: *on
      nrdotCollector: {otlpReceiver: {enabled: false}}
    asserts:
      - template: templates/nr-ebpf-agent-obi-daemonset.yaml
        failedTemplate:
          errorPattern: needs the per-node nrdot collector
