suite: kernel header installer gating
templates:
  - templates/nr-ebpf-agent-daemonset.yaml
  - templates/nr-ebpf-agent-kernel-header-configmap.yaml
  - templates/secrets.yaml
release:
  name: my-release
  namespace: my-namespace

tests:
  - it: installs kernel headers by default (Chart.AppVersion < 1.7.0)
    set: &base
      cluster: test-cluster
      licenseKey: test-license-key
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: kernel-header-installer
          any: true
        template: templates/nr-ebpf-agent-daemonset.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kernel-headers-volume
          any: true
        template: templates/nr-ebpf-agent-daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kernel-headers-volume
          any: true
        template: templates/nr-ebpf-agent-daemonset.yaml
      - hasDocuments:
          count: 1
        template: templates/nr-ebpf-agent-kernel-header-configmap.yaml

  - it: skips kernel header installation for CORE agent images (>= 1.7.0)
    set:
      <<: *base
      ebpfAgent:
        image:
          tag: 1.7.0
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
        template: templates/nr-ebpf-agent-daemonset.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: kernel-headers-volume
        template: templates/nr-ebpf-agent-daemonset.yaml
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kernel-headers-volume
        template: templates/nr-ebpf-agent-daemonset.yaml
      - hasDocuments:
          count: 0
        template: templates/nr-ebpf-agent-kernel-header-configmap.yaml

  - it: skips kernel header installation for newer CORE agent images (e.g. 1.8.2)
    set:
      <<: *base
      ebpfAgent:
        image:
          tag: 1.8.2
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
        template: templates/nr-ebpf-agent-daemonset.yaml

  - it: still installs kernel headers for pre-CORE agent images (e.g. 1.6.9)
    set:
      <<: *base
      ebpfAgent:
        image:
          tag: 1.6.9
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: kernel-header-installer
          any: true
        template: templates/nr-ebpf-agent-daemonset.yaml

  - it: forces kernel header installation off via override even on a pre-CORE tag
    set:
      <<: *base
      ebpfAgent:
        image:
          tag: 1.6.9
        kernelHeaderInstaller:
          enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
        template: templates/nr-ebpf-agent-daemonset.yaml

  - it: forces kernel header installation on via override even on a CORE tag
    set:
      <<: *base
      ebpfAgent:
        image:
          tag: 1.7.0
        kernelHeaderInstaller:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: kernel-header-installer
          any: true
        template: templates/nr-ebpf-agent-daemonset.yaml
      - hasDocuments:
          count: 1
        template: templates/nr-ebpf-agent-kernel-header-configmap.yaml
