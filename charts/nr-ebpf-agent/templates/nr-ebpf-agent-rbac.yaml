apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nr-ebpf-agent.service.name" . }}
  labels:
    {{- include "newrelic.common.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - namespaces
  - nodes
  - services
  - endpoints
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - "apps"
  resources:
  - replicasets
  verbs:
  - get
  - watch
  - list
{{- if .Values.infraDetection.enabled }}
# eBPF-infra deactivation: the detect-infra init container lists DaemonSets and
# Deployments cluster-wide to check whether a traditional infrastructure agent is
# present. Deployments are required because nri-kubernetes' KSM / cluster metrics
# component (nrk8s-ksm) is a Deployment, not a DaemonSet - that is the component
# the nrdot cluster Deployment must stand down for.
- apiGroups:
  - "apps"
  resources:
  - daemonsets
  - deployments
  verbs:
  - get
  - watch
  - list
{{- end }}
{{- if (include "nr-ebpf-agent.nrdotCollector.enabled" .) }}
# nrdot collector permissions (shared by the per-node sidecar and the cluster
# Deployment, which both run under this ServiceAccount):
#  - nodes/stats, nodes/proxy: kubeletstats receiver (kubelet API)
#  - events: k8s_events receiver
#  - /metrics (nonResourceURL): API server controlplane scrape (kubernetes_build_info)
- nonResourceURLs:
  - /metrics
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - nodes/stats
  - nodes/proxy
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "events.k8s.io"
  resources:
  - events
  verbs:
  - get
  - list
  - watch
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nr-ebpf-agent.service.name" . }}
  labels:
    {{- include "newrelic.common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nr-ebpf-agent.service.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "nr-ebpf-agent.service.name" . }}
  namespace: '{{ .Release.Namespace }}'
