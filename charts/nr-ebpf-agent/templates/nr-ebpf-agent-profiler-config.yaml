{{- if .Values.profiler.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nr-ebpf-agent.fullname" . }}-profiler-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newrelic.common.labels" . | nindent 4 }}
data:
  config.yaml: |
    # service.name is not set here: the profiler takes it per process from the app's
    # OTEL_SERVICE_NAME in /proc/PID/environ (hence hostPID).
    receivers:
      profiling:
        reporter_interval: {{ .Values.profiler.reporterInterval }}
    exporters:
      otlp:
        # The per-node nrdot collector's receiver, through its node-local Service.
        endpoint: {{ include "nr-ebpf-agent.nrdot.pernode.otlpGrpcAddress" . }}
        tls:
          insecure: true
    service:
      telemetry:
        metrics:
          level: none
      pipelines:
        profiles:
          receivers: [profiling]
          exporters: [otlp]
{{- end }}
