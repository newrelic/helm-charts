{{- if .Values.profiler.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nr-ebpf-agent.fullname" . }}-profiler-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newrelic.common.labels" . | nindent 4 }}
data:
  config.yaml: |
    # service.name is not set here: the profiler takes it per process from the app's
    # OTEL_SERVICE_NAME in /proc/PID/environ (hence hostPID).
    receivers:
      profiling:
        reporter_interval: {{ .Values.profiler.reporterInterval }}
    exporters:
      otlp:
        # The per-node nrdot collector's receiver, through its node-local Service.
        endpoint: {{ include "nr-ebpf-agent.nrdot.pernode.otlpGrpcAddress" . }}
        tls:
          insecure: true
    {{- if .Values.profiler.entityNameFilter }}
    processors:
      # Entity-name allow-list. A profile is dropped when its service.name matches none of the allowed names.
      filter/entity:
        error_mode: ignore
        profile_conditions:
          - conditions:
              - {{ range $i, $n := .Values.profiler.entityNameFilter }}{{ if $i }} and {{ end }}resource.attributes["service.name"] != {{ $n | quote }}{{ end }}
    {{- end }}
    service:
      telemetry:
        metrics:
          level: none
      pipelines:
        profiles:
          receivers: [profiling]
          {{- if .Values.profiler.entityNameFilter }}
          processors: [filter/entity]
          {{- end }}
          exporters: [otlp]
{{- end }}
