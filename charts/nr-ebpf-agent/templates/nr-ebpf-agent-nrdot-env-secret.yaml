{{- if (include "nr-ebpf-agent.nrdotCollector.enabled" .) }}
{{- /*
Chart-managed credential Secret(s) for the nrdot collectors, materialized from
nrdotCollector.<role>.secretEnv and mounted via envFrom (see _nrdot.tpl). One
Secret per role that sets a non-empty secretEnv. Prefer extraEnv+secretKeyRef or
an externally-managed Secret via extraEnvFrom if you don't want plaintext values.
*/ -}}
{{- range $role := (list "sidecar" "clusterCollector") }}
{{- $se := dig $role "secretEnv" dict $.Values.nrdotCollector }}
{{- if $se }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nr-ebpf-agent.nrdot.envSecretName" (dict "ctx" $ "roleKey" $role) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "newrelic.common.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $se }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
