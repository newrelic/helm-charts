---
# Default values for the OpenTelemetry eBPF Instrumentation (OBI) DaemonSet.
#
# These are defaults only. Override any key in your own values file, with --set,
# or under `nr-ebpf-agent:` in a parent chart; user values always take precedence.
# Settings shared by all components live in the chart's values.yaml.

obi:
  # -- Deploy the OBI DaemonSet.
  enabled: false
  image:
    # -- OBI image registry. Overrides `global.images.registry`. Defaults to docker.io
    registry: ""
    # -- OBI image repository.
    repository: otel/ebpf-instrument
    # -- OBI image tag.
    tag: "v0.15.2"
    # -- Image pull policy. Overrides `global.images.pullPolicy`.
    pullPolicy: ""
  resources:
    limits:
      # -- Max memory allocated to the container.
      memory: 1Gi
    requests:
      # -- Min CPU allocated to the container.
      cpu: 100m
      # -- Min memory allocated to the container.
      memory: 256Mi
  # -- Observability mode. Same values as the OSS opentelemetry-ebpf-instrumentation chart.
  # "application" (default): instruments K8s app processes — HTTP/gRPC/DB traces and metrics.
  # "network": also enables TCP/DNS network-level capture.
  #   Ignored when obi.config.data is set (obi.config.data takes full precedence).
  preset: "application"
  # -- Full OBI config v2 YAML. Mirrors the OSS chart's `config:` block exactly.
  # Paste your OSS `config:` section here verbatim — only change the exporter endpoints:
  #   gRPC: ${OTEL_EXPORTER_OTLP_ENDPOINT}         (auto-injected, protected)
  #   HTTP: ${OTEL_EXPORTER_OTLP_HTTP_ENDPOINT}     (auto-injected, protected)
  config:
    data: {}
  # -- OBI env vars. Paste the OSS `env:` block here verbatim.
  # The following keys are set by the chart and will be ignored with a WARNING if supplied:
  #   OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HTTP_ENDPOINT,
  #   OTEL_EXPORTER_OTLP_PROTOCOL, OTEL_EXPORTER_OTLP_HEADERS,
  #   NEW_RELIC_LICENSE_KEY, OTEL_EBPF_KUBE_CLUSTER_NAME
  env:
    GOGC: "30"
    OTEL_EBPF_OPEN_PORT: "1-65535"
    OTEL_EBPF_METRICS_FEATURES: application
    OTEL_EBPF_TRACES_INSTRUMENTATIONS: "*"
    OTEL_EBPF_BPF_CONTEXT_PROPAGATION: all
    OTEL_EBPF_BPF_HIGH_REQUEST_VOLUME: "true"
    OTEL_EBPF_JAVAAGENT_ATTACH_TIMEOUT: 60s
    # -- Trace sampler. Use parentbased_traceidratio with OTEL_TRACES_SAMPLER_ARG
    # to sample a fraction of root traces (e.g. 0.1 = 10%).
    OTEL_TRACES_SAMPLER: parentbased_always_on
    # -- Sampler argument. Required when OTEL_TRACES_SAMPLER is parentbased_traceidratio.
    # Set to a value between 0.0 and 1.0 (e.g. "0.1" to sample 10% of root traces).
    OTEL_TRACES_SAMPLER_ARG: ""
    OTEL_EBPF_LOG_LEVEL: info
    OTEL_EBPF_SDK_LOG_LEVEL: info
    OTEL_EBPF_BPF_BATCH_LENGTH: "1000"
    OTEL_EBPF_OTLP_TRACES_BATCH_MAX_SIZE: "512"
  # -- OBI env vars sourced from Secrets or ConfigMaps. Paste the OSS `envValueFrom:` block verbatim.
  envValueFrom: {}
