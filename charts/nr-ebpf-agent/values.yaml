---
# Settings shared by every component of this chart.
#
# Each component's own defaults live in a separate file under components/:
#   components/ebpf-agent.yaml  eBPF agent DaemonSet (ebpfAgent, protocols, data filters, report*, endpoints, proxies)
#   components/nrdot.yaml       nrdot collectors + kube-state-metrics (infra, nrdotCollector)
#   components/obi.yaml         OpenTelemetry eBPF Instrumentation (obi)
#   components/profiler.yaml    OpenTelemetry eBPF profiler (profiler)
# The chart merges those defaults under your values at render time, so you
# override any component key exactly as before, e.g. `--set obi.enabled=true`
# or `profiler: {enabled: true}` in your values file.

# -- Name of the Kubernetes cluster to be monitored. Mandatory. Can be configured with `global.cluster`
cluster: ""
# -- The license key to use. Can be configured with `global.licenseKey`
licenseKey: ""
# -- In case you don't want to have the license key in your values, this allows you to point to a user created secret to get the key from there. Can be configured also with `global.customSecretName`
customSecretName: ""
# -- In case you don't want to have the license key in your values, this allows you to point to which secret key is the license key located. Can be configured also with `global.customSecretLicenseKey`
customSecretLicenseKey: ""
# -- If using a customSecretLicenseKey, you must supply your region "US"/"EU". Otherwise, leave this value as an empty string.
region: ""
# -- Image pull secrets. Overrides `global.images.pullSecrets`
imagePullSecrets: []

# -- Additional labels for chart pods.
podLabels: {}
# -- Additional labels for chart objects.
labels: {}
# -- Sets pod's priorityClassName. Can be configured also with `global.priorityClassName`
priorityClassName: ""
# -- Sets pod's dnsConfig. Can be configured also with `global.dnsConfig`
dnsConfig: {}
# -- Sets all pods' node selector. Can be configured also with `global.nodeSelector`
nodeSelector: {}
# -- Sets all pods' tolerations to node taints. Can be configured also with `global.tolerations`.
# Defaults to tolerating ALL `NoSchedule`/`NoExecute` taints so the agent (and the per-node
# nrdot collector DaemonSet, which inherits the agent's tolerations) is scheduled on every node — matching nri-kubernetes.
# This is required for full K8s infra parity: nodes carrying taints such as
# `CriticalAddonsOnly` (e.g. AKS system pools) would otherwise be left unmonitored.
# Set to `[]` to restrict scheduling, or override per-component via `ebpfAgent.tolerations`.
tolerations:
  - operator: "Exists"
    effect: "NoSchedule"
  - operator: "Exists"
    effect: "NoExecute"
# -- Sets all pods' affinities. Can be configured also with `global.affinity`
affinity: {}
# -- Sets all pods' podSecurityContext. Can be configured also with `global.securityContext.pod`
podSecurityContext: {}
# --  Kubernetes cluster domain.
kubernetesClusterDomain: cluster.local

# =============================================================================
# Multi-account routing + nrdot Kubernetes-infrastructure collector
# =============================================================================
# -- Map of Kubernetes namespace -> New Relic license key, for routing telemetry
# to different accounts. The customer sets this ONCE; the chart generates from it
# both the eBPF agent's routing map (NAMESPACE_LICENSE_KEY_MAP) and the nrdot
# collector's per-account exporters. Namespaces not listed
# fall back to the default `licenseKey`. Keys are stored in the chart Secret.
# Example: namespaceLicenseKeys: { team-a: "NRAK-aaa", team-b: "NRAK-bbb" }
namespaceLicenseKeys: {}
