{{- include "oracle-otel.validate.oracle" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oracle-otel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oracle-otel.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "oracle-otel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oracle-otel.labels" . | nindent 8 }}
    spec:
      containers:
        - name: oracle-otel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/oracle-otel/config.yaml
          env:
            - name: ORACLE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "oracle-otel.credentials.secretName" . }}
                  key: username
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "oracle-otel.credentials.secretName" . }}
                  key: password
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "newrelic.common.license.secretName" . }}
                  key: {{ include "newrelic.common.license.secretKeyName" . }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/oracle-otel
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "oracle-otel.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
