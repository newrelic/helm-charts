suite: deployment (oracleMulti)
templates:
  - templates/deployment-multi.yaml
  - templates/configmap-multi.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  oracleMulti.enabled: true
  oracleMulti.topology: "rds"
  oracleMulti.databases:
    - name: db1
      endpoint: "host1:1521"
      service: "ORCL1"
      existingSecret: "db1-creds"
    - name: db2
      endpoint: "host2:1521"
      service: "ORCL2"
      existingSecret: "db2-creds"
  otlpEndpoint: "otlp.nr-data.net:4317"
  licenseKey: "testlicensekey"
tests:
  - it: sets one secretKeyRef pair per database entry, named after that entry
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0]
          value:
            name: ORACLE_USERNAME_DB1
            valueFrom:
              secretKeyRef:
                name: db1-creds
                key: username
        template: templates/deployment-multi.yaml
      - equal:
          path: spec.template.spec.containers[0].env[1]
          value:
            name: ORACLE_PASSWORD_DB1
            valueFrom:
              secretKeyRef:
                name: db1-creds
                key: password
        template: templates/deployment-multi.yaml
      - equal:
          path: spec.template.spec.containers[0].env[2]
          value:
            name: ORACLE_USERNAME_DB2
            valueFrom:
              secretKeyRef:
                name: db2-creds
                key: username
        template: templates/deployment-multi.yaml
      - equal:
          path: spec.template.spec.containers[0].env[3]
          value:
            name: ORACLE_PASSWORD_DB2
            valueFrom:
              secretKeyRef:
                name: db2-creds
                key: password
        template: templates/deployment-multi.yaml
  - it: mounts the shared multi-instance ConfigMap and sets a config checksum annotation
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: my-release-oracle-otel-config
        template: templates/deployment-multi.yaml
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/config"]
        template: templates/deployment-multi.yaml
  - it: renders exactly one Deployment for the whole release, regardless of database count
    asserts:
      - hasDocuments:
          count: 1
        template: templates/deployment-multi.yaml
