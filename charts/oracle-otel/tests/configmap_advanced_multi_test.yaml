suite: configmap (oracleMulti configProfile)
templates:
  - templates/configmap-multi.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  oracleMulti.enabled: true
  oracleMulti.topology: "rds"
  oracleMulti.databases:
    - name: db1
      endpoint: "host1.rds.amazonaws.com:1521"
      service: "ORCL1"
      existingSecret: "db1-creds"
    - name: db2
      endpoint: "host2.rds.amazonaws.com:1521"
      service: "ORCL2"
      existingSecret: "db2-creds"
  otlpEndpoint: "otlp.nr-data.net:4317"
tests:
  - it: fails when oracleMulti.configProfile is empty
    set:
      oracleMulti.configProfile: ""
    asserts:
      - failedTemplate:
          errorMessage: "oracleMulti.configProfile must be one of: basic, advanced"
  - it: fails when oracleMulti.configProfile has the wrong case
    set:
      oracleMulti.configProfile: "Advanced"
    asserts:
      - failedTemplate:
          errorMessage: "oracleMulti.configProfile must be one of: basic, advanced"
  - it: defaults to basic
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.db\\.time:"
  - it: renders the advanced catalog on the first entry only
    set:
      oracleMulti.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.db\\.time:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "(?s)oracledb\\.db\\.time:.*oracledb\\.db\\.time:"
  - it: adds asm metrics for pdb but not rds
    set:
      oracleMulti.topology: pdb
      oracleMulti.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.asm\\.disk\\.errors:"
  - it: omits asm metrics for rds
    set:
      oracleMulti.configProfile: advanced
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.asm\\."
  - it: ignores oracle.configProfile in multi mode
    set:
      oracle.configProfile: advanced
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.db\\.time:"
