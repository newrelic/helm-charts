suite: configmap
templates:
  - templates/configmap.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  oracle.endpoint: "oracle-db.internal:1521"
  oracle.service: "MYPDB"
  oracle.topology: "pdb"
  oracle.username: "nr_monitor"
  oracle.password: "s3cret"
  oracle.collectionInterval: "30s"
  otlpEndpoint: "otlp.nr-data.net:4317"
tests:
  - it: fails when oracle.topology is unset or invalid
    set:
      oracle.topology: ""
    asserts:
      - failedTemplate:
          errorMessage: "oracle.topology must be one of: cdb, pdb, rds, adb -- required to select the correct nroracledb metrics/events defaults"
  - it: renders the nroracledb receiver with env-substitution credentials, never literal ones
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: \"oracle-db\\.internal:1521\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "service: \"MYPDB\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "username: \"\\$\\{env:ORACLE_USERNAME\\}\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "password: \"\\$\\{env:ORACLE_PASSWORD\\}\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "collection_interval: 30s"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "s3cret"
  - it: renders the otlp/newrelic exporter with an env-substitution api-key, never a literal one
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: \"otlp\\.nr-data\\.net:4317\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "api-key: \"\\$\\{env:NEW_RELIC_LICENSE_KEY\\}\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "retry_on_failure:"
  - it: wires the oracledb pipeline to the receiver, processors, and exporter
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers:\\s*\\[nroracledb\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exporters:\\s*\\[otlp/newrelic\\]"
  - it: merges additionalReceiverConfig into the receiver block
    set:
      additionalReceiverConfig:
        events:
          db.server.query_sample:
            enabled: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "db\\.server\\.query_sample"
  - it: renders the shared events/collection defaults regardless of topology
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "db\\.server\\.query_sample:\\s*\\n\\s*enabled: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "db\\.server\\.top_query:\\s*\\n\\s*enabled: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "db\\.server\\.session\\.wait_sample:\\s*\\n\\s*enabled: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "db\\.server\\.top_procedure:\\s*\\n\\s*enabled: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "db\\.server\\.query_plan:\\s*\\n\\s*enabled: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "top_query_collection:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "query_sample_collection:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "session_wait_event_collection:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "top_procedure_collection:\\s*\\n\\s*max_procedure_sample_count: 1000\\s*\\n\\s*top_procedure_count: 250\\s*\\n\\s*collection_interval: 60s"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "resource_attributes:\\s*\\n\\s*oracle\\.db\\.edition:\\s*\\n\\s*enabled: true"
  - it: renders the cdb/pdb metrics and resource_attributes defaults for pdb topology
    set:
      oracle.topology: "pdb"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.sessions\\.usage:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.sql_service\\.response\\.duration:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "resource_attributes:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "oracle\\.db\\.edition:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.instance\\.name:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers:\\s*\\n\\s*nroracledb:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers:\\s*\\[nroracledb\\]"
  - it: renders the same metrics and resource_attributes defaults for cdb topology as pdb
    set:
      oracle.topology: "cdb"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.sessions\\.usage:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "resource_attributes:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "oracle\\.db\\.edition:"
  - it: renders receiver fields in the documented order -- endpoint, username, password, service, then collection blocks, then metrics
    set:
      oracle.topology: "rds"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint:.*\\n\\s*username:.*\\n\\s*password:.*\\n\\s*service:.*\\n\\s*collection_interval:.*\\n\\s*events:"
  - it: renders the reduced rds metrics defaults and the shared oracle.db.edition resource attribute
    set:
      oracle.topology: "rds"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.cpu_time:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.sessions\\.limit:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.dml_locks\\.usage:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers:\\s*\\n\\s*nroracledb/rds:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers:\\s*\\[nroracledb/rds\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "resource_attributes:\\s*\\n\\s*oracle\\.db\\.edition:"
  - it: additionalReceiverConfig can still override a topology default metric
    set:
      oracle.topology: "rds"
      additionalReceiverConfig:
        metrics:
          oracledb.cpu_time:
            enabled: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.cpu_time:\\n(?:.*\\n)*?\\s*enabled: false"
  - it: fails clearly when additionalReceiverConfig overrides a metric with a scalar instead of a map
    set:
      additionalReceiverConfig:
        metrics:
          oracledb.cpu_time: false
    asserts:
      - failedTemplate:
          errorMessage: "additionalReceiverConfig.metrics.oracledb.cpu_time must be a map, e.g. {enabled: true} -- got false"
  - it: renders a single datasource connection string for adb, not discrete endpoint/username/password/service fields
    set:
      oracle.topology: "adb"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "datasource: \"oracle://\\$\\{env:ORACLE_USERNAME\\}:\\$\\{env:ORACLE_PASSWORD\\}@oracle-db\\.internal:1521/MYPDB\\?ssl=true&ssl%20verify=true\""
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: \"oracle-db\\.internal:1521\""
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "^\\s*username:"
  - it: renders the adb metrics defaults, including oracle.db.pdb attributes, and keeps the shared oracle.db.edition resource attribute
    set:
      oracle.topology: "adb"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.cpu_time:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "oracledb\\.sessions\\.limit:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "resource_attributes:\\s*\\n\\s*oracle\\.db\\.edition:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "oracle\\.db\\.pdb"
  - it: uses the nroracledb/adb receiver key and the otlp/newrelic exporter
    set:
      oracle.topology: "adb"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers:\\s*\\n\\s*nroracledb/adb:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers:\\s*\\[nroracledb/adb\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "otlp/newrelic:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exporters:\\s*\\[otlp/newrelic\\]"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "otlphttp/newrelic:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "telemetry:"
