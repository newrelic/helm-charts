suite: credentials
templates:
  - templates/secret.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  oracle.endpoint: "db:1521"
  oracle.service: "MYPDB"
  otlpEndpoint: "otlp.nr-data.net:4317"
tests:
  - it: renders a chart-owned Secret when plain username/password are given
    set:
      oracle.username: "nr_monitor"
      oracle.password: "s3cret"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: my-release-oracle-otel-oracle
      - equal:
          path: data.username
          value: bnJfbW9uaXRvcg==
      - equal:
          path: data.password
          value: czNjcmV0
  - it: renders nothing when existingSecret is given
    set:
      oracle.existingSecret: "my-oracle-secret"
    asserts:
      - hasDocuments:
          count: 0
