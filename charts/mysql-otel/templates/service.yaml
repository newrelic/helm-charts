{{- $advanced := ternary (eq .Values.mysqlMulti.configProfile "advanced") (eq .Values.mysql.configProfile "advanced") .Values.mysqlMulti.enabled }}
{{- if $advanced }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mysql-otel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mysql-otel.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mysql-otel.selectorLabels" . | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
{{- end }}
