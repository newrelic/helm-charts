{{- if .Values.mysqlMulti.enabled }}
{{- include "mysql-otel.validate.mysqlMulti" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mysql-otel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mysql-otel.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mysql-otel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mysql-otel.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-multi.yaml") . | sha256sum }}
    spec:
      containers:
        - name: mysql-otel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/mysql-otel/config.yaml
          env:
            {{- range .Values.mysqlMulti.databases }}
            {{- $suffix := include "mysql-otel.multi.envVarSuffix" .name }}
            - name: MYSQL_USERNAME_{{ $suffix }}
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: username
            - name: MYSQL_PASSWORD_{{ $suffix }}
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: password
            {{- end }}
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "newrelic.common.license.secretName" . }}
                  key: {{ include "newrelic.common.license.secretKeyName" . }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/mysql-otel
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "mysql-otel.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
