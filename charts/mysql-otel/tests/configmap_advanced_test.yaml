suite: configmap (configProfile)
templates:
  - templates/configmap.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  mysql.server: "mysql.internal"
  mysql.topology: "self-hosted"
  mysql.username: "nr_monitor"
  mysql.password: "s3cret"
  otlpEndpoint: "otlp.nr-data.net:4317"
tests:
  - it: fails when mysql.configProfile is empty
    set:
      mysql.configProfile: ""
    asserts:
      - failedTemplate:
          errorMessage: "mysql.configProfile must be one of: basic, advanced"
  - it: fails when mysql.configProfile has the wrong case
    set:
      mysql.configProfile: "Advanced"
    asserts:
      - failedTemplate:
          errorMessage: "mysql.configProfile must be one of: basic, advanced"
  - it: defaults to basic, with none of the advanced config
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "mysql\\.uptime:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "resource_detection"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "health_check"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "sending_queue"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "otlp:\\n"
  - it: renders the full metric catalog, keeping the basic metrics
    set:
      mysql.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "mysql\\.uptime:\\n\\s*enabled: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "mysql\\.thread\\.slow_launch:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "mysql\\.query\\.count:"
  - it: adds the exporter queue, resource detection, health check, app otlp receiver and the doc's pipelines
    set:
      mysql.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sending_queue:\\n\\s*enabled: true\\n\\s*sizer: bytes\\n\\s*queue_size: 100_000_000"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "resource_detection/cloud:\\n\\s*detectors: \\[\"gcp\", \"ec2\", \"azure\"\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "extensions:\\n\\s*health_check:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "extensions: \\[health_check\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "otlp:\\n\\s*protocols:\\n\\s*grpc:\\n\\s*endpoint: 0\\.0\\.0\\.0:4317\\n\\s*http:\\n\\s*endpoint: 0\\.0\\.0\\.0:4318"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "metrics/mysql:\\n\\s*receivers: \\[nrmysql\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "logs/mysql:\\n\\s*receivers: \\[nrmysql\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "traces:\\n\\s*receivers: \\[otlp\\]\\n\\s*processors: \\[transform, resource_detection, resource_detection/cloud, resource_detection/env, batch\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "level: none"
  - it: renders the same advanced catalog for rds
    set:
      mysql.topology: rds
      mysql.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "mysql\\.uptime:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "metrics/mysql:"
  - it: additionalReceiverConfig can disable an advanced-only metric
    set:
      mysql.configProfile: advanced
      additionalReceiverConfig:
        metrics:
          mysql.uptime:
            enabled: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "mysql\\.uptime:\\n\\s*enabled: false"
  - it: ignores mysqlMulti.configProfile in single mode
    set:
      mysqlMulti.configProfile: advanced
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "mysql\\.uptime:"
