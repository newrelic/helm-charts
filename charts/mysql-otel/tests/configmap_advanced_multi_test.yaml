suite: configmap (mysqlMulti configProfile)
templates:
  - templates/configmap-multi.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  mysqlMulti.enabled: true
  mysqlMulti.topology: "self-hosted"
  mysqlMulti.databases:
    - name: db1
      server: "host1.example.internal"
      existingSecret: "db1-creds"
    - name: db2
      server: "host2.example.internal"
      existingSecret: "db2-creds"
  otlpEndpoint: "otlp.nr-data.net:4317"
tests:
  - it: fails when mysqlMulti.configProfile is empty
    set:
      mysqlMulti.configProfile: ""
    asserts:
      - failedTemplate:
          errorMessage: "mysqlMulti.configProfile must be one of: basic, advanced"
  - it: fails when mysqlMulti.configProfile has the wrong case
    set:
      mysqlMulti.configProfile: "Advanced"
    asserts:
      - failedTemplate:
          errorMessage: "mysqlMulti.configProfile must be one of: basic, advanced"
  - it: defaults to basic
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "mysql\\.uptime:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "health_check"
  - it: renders the advanced metrics on the first database only
    set:
      mysqlMulti.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "mysql\\.uptime:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "(?s)mysql\\.uptime:.*mysql\\.uptime:"
  - it: lists every database receiver on the mysql pipelines and the app otlp receiver on the app pipelines
    set:
      mysqlMulti.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "metrics/mysql:\\n\\s*receivers: \\[nrmysql/db1, nrmysql/db2\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "logs/mysql:\\n\\s*receivers: \\[nrmysql/db1, nrmysql/db2\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "traces:\\n\\s*receivers: \\[otlp\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: 0\\.0\\.0\\.0:4317"
  - it: ignores mysql.configProfile in multi mode
    set:
      mysql.configProfile: advanced
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "mysql\\.uptime:"
