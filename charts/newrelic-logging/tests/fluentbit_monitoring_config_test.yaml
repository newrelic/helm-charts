suite: test fluent-bit entity synthesis labels include (yaml config)
templates:
  - templates/configmap.yaml
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "includes additional labels with cluster name empty"
    set:
      cluster: ""
      fluentBit:
        fluentBitMetrics: "advanced"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: "(?s)- 'cluster_name \"\"'\\n\\s*- \"namespace my-namespace\"\\n\\s*- \"daemonset_name my-release-newrelic-logging\""
  - it: "includes additional labels with cluster name null"
    set:
      cluster: null
      fluentBit:
        fluentBitMetrics: "advanced"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: "(?s)- 'cluster_name \"\"'\\n\\s*- \"namespace my-namespace\"\\n\\s*- \"daemonset_name my-release-newrelic-logging\""
  - it: "includes additional labels when cluster name is set"
    set:
      cluster: my-cluster
      fluentBit:
        fluentBitMetrics: "advanced"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: "(?s)- \"cluster_name my-cluster\"\\n\\s*- \"namespace my-namespace\"\\n\\s*- \"daemonset_name my-release-newrelic-logging\""
  - it: "advanced metrics add the prometheus scraper and remote write"
    set:
      fluentBit:
        fluentBitMetrics: "advanced"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: "(?s)- name: prometheus_scrape.*- name: prometheus_remote_write"
      - notMatchRegex:
          path: data["fluent-bit.yaml"]
          pattern: "- name: dummy"
  - it: "basic metrics add the buildInfo input, filters and output"
    set:
      fluentBit:
        fluentBitMetrics: "basic"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: "(?s)- name: dummy\\n\\s*tag: buildInfo"
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: "(?s)- name: http\\n\\s*match: buildInfo"
  - it: "none adds no metrics pipeline"
    set:
      fluentBit:
        fluentBitMetrics: "none"
    asserts:
      - notMatchRegex:
          path: data["fluent-bit.yaml"]
          pattern: "buildInfo|prometheus_scrape"
