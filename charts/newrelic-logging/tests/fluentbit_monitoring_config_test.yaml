suite: test fluent-bit entity synthesis labels include
templates:
  - templates/configmap.yaml
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "includes additional labels with cluster name empty"
    set:
      cluster: ""
      fluentBit:
        fluentBitMetrics: "advanced"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: (?s)- cluster_name \"\"\n\s*- namespace my-namespace\n\s*- daemonset_name my-release-newrelic-logging
  - it: "includes additional labels with cluster name empty with single quote"
    set:
      cluster: ''
      fluentBit:
        fluentBitMetrics: "advanced"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: (?s)- cluster_name \"\"\n\s*- namespace my-namespace\n\s*- daemonset_name my-release-newrelic-logging
  - it: "includes additional labels with cluster name null"
    set:
      fluentBit:
        fluentBitMetrics: "advanced"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: (?s)- cluster_name \"\"\n\s*- namespace my-namespace\n\s*- daemonset_name my-release-newrelic-logging
  - it: "includes additional labels with cluster name setting null"
    set:
      cluster: 
      fluentBit:
        fluentBitMetrics: "advanced"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: (?s)- cluster_name \"\"\n\s*- namespace my-namespace\n\s*- daemonset_name my-release-newrelic-logging
  - it: "includes additional labels with cluster name setting null value"
    set:
      cluster: null
      fluentBit:
        fluentBitMetrics: "advanced"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: (?s)- cluster_name \"\"\n\s*- namespace my-namespace\n\s*- daemonset_name my-release-newrelic-logging
  - it: "includes additional labels when cluster name is set"
    set:
      cluster: my-cluster
      fluentBit:
        fluentBitMetrics: "advanced"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: (?s)- cluster_name my-cluster\n\s*- namespace my-namespace\n\s*- daemonset_name my-release-newrelic-logging
  - it: "includes additional labels when cluster name is set with double quotes"
    set:
      cluster: "my-cluster"
      fluentBit:
        fluentBitMetrics: "advanced"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: (?s)- cluster_name my-cluster\n\s*- namespace my-namespace\n\s*- daemonset_name my-release-newrelic-logging          
  - it: "includes additional labels with cluster name empty for basic"
    set:
      cluster: ""
      fluentBit:
        fluentBitMetrics: "basic"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: (?s)- cluster_name "\$\{CLUSTER_NAME\}"

  - it: "includes additional labels with cluster name set for basic"
    set:
      cluster: my-cluster
      fluentBit:
        fluentBitMetrics: "basic"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: (?s)- cluster_name "\$\{CLUSTER_NAME\}"
  - it: "includes additional labels with cluster name empty for basic"
    set:
      cluster: ""
      fluentBit:
        fluentBitMetrics: "basic"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: "(?s)- name: dummy\\s+tag: buildInfo"
  - it: "includes additional labels with cluster name set for basic"
    set:
      cluster: my-cluster
      fluentBit:
        fluentBitMetrics: "basic"
    asserts:
      - matchRegex:
          path: data["fluent-bit.yaml"]
          pattern: "(?s)- name: dummy\\s+tag: buildInfo"