{{- include "newrelic-logging.fluentBit.assertSingleFormat" . -}}
{{- $format := include "newrelic-logging.fluentBit.format" . -}}
{{- $filtersKey := "filters" -}}
{{- if include "newrelic-logging.lowDataMode" . -}}
  {{- $filtersKey = "lowDataModeFilters" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  labels: {{ include "newrelic-logging.labels" . | indent 4 }}
  name: {{ template "newrelic-logging.fluentBitConfig" . }}
data:
{{- if eq $format "classic" }}
  fluent-bit.conf: |
    {{- include "newrelic-logging.fluentBit.block" (dict "root" . "key" "service") | nindent 4 }}
    {{- include "newrelic-logging.fluentBit.block" (dict "root" . "key" "inputs") | nindent 4 }}
    {{- with .Values.fluentBit.config.extraInputs }}
      {{- . | nindent 4 }}
    {{- end }}
    {{- include "newrelic-logging.fluentBit.block" (dict "root" . "key" $filtersKey) | nindent 4 }}
    {{- with .Values.fluentBit.config.extraFilters }}
      {{- . | nindent 4 }}
    {{- end }}
    {{- include "newrelic-logging.fluentBit.block" (dict "root" . "key" "outputs") | nindent 4 }}
    {{- with .Values.fluentBit.config.extraOutputs }}
      {{- . | nindent 4 }}
    {{- end }}
    {{- (include "newrelic-logging.fluentBit.monitoring.config" .) | nindent 4 }}
    {{- (include "newrelic-logging.fluentBit.classicDeprecation.config" .) | nindent 4 }}
  parsers.conf: |
  {{- with .Values.fluentBit.config.parsers }}
    {{- . | nindent 4 }}
  {{- end }}
{{- else }}
  fluent-bit.yaml: |
    service:
      {{- include "newrelic-logging.fluentBit.block" (dict "root" . "key" "service") | nindent 6 }}
    pipeline:
      inputs:
        {{- include "newrelic-logging.fluentBit.block" (dict "root" . "key" "inputs") | nindent 8 }}
        {{- with .Values.fluentBit.config.extraInputs }}
          {{- . | nindent 8 }}
        {{- end }}
        {{- with (include "newrelic-logging.fluentBit.monitoring.yaml.inputs" . | trim) }}
          {{- . | nindent 8 }}
        {{- end }}
      filters:
        {{- include "newrelic-logging.fluentBit.block" (dict "root" . "key" $filtersKey) | nindent 8 }}
        {{- with .Values.fluentBit.config.extraFilters }}
          {{- . | nindent 8 }}
        {{- end }}
        {{- with (include "newrelic-logging.fluentBit.monitoring.yaml.filters" . | trim) }}
          {{- . | nindent 8 }}
        {{- end }}
      outputs:
        {{- include "newrelic-logging.fluentBit.block" (dict "root" . "key" "outputs") | nindent 8 }}
        {{- with .Values.fluentBit.config.extraOutputs }}
          {{- . | nindent 8 }}
        {{- end }}
        {{- with (include "newrelic-logging.fluentBit.monitoring.yaml.outputs" . | trim) }}
          {{- . | nindent 8 }}
        {{- end }}
  parsers.yaml: |
    {{- with .Values.fluentBit.config.parsers }}
    parsers:
      {{- . | nindent 6 }}
    {{- else }}
    parsers: []
    {{- end }}
{{- end }}
