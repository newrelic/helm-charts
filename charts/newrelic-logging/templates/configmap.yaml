{{- include "newrelic-logging.fluentBit.assertYamlConfig" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  labels: {{ include "newrelic-logging.labels" . | indent 4 }}
  name: {{ template "newrelic-logging.fluentBitConfig" . }}
data:
  fluent-bit.yaml: |
    {{- if .Values.fluentBit.config.service }}
    service:
      {{- .Values.fluentBit.config.service | nindent 6 }}
    {{- end }}
    pipeline:
      inputs:
      {{- with .Values.fluentBit.config.inputs }}
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.fluentBit.config.extraInputs }}
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "newrelic-logging.fluentBit.monitoring.inputs" .) }}
        {{- . | nindent 8 }}
      {{- end }}
      filters:
      {{- if and (include "newrelic-logging.lowDataMode" .) (.Values.fluentBit.config.lowDataModeFilters) }}
        {{- .Values.fluentBit.config.lowDataModeFilters | nindent 8 }}
      {{- else }}
        {{- .Values.fluentBit.config.filters | nindent 8 }}
      {{- end }}
      {{- with .Values.fluentBit.config.extraFilters }}
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "newrelic-logging.fluentBit.monitoring.filters" .) }}
        {{- . | nindent 8 }}
      {{- end }}
      outputs:
      {{- with .Values.fluentBit.config.outputs }}
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.fluentBit.config.extraOutputs }}
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "newrelic-logging.fluentBit.monitoring.outputs" .) }}
        {{- . | nindent 8 }}
      {{- end }}
  parsers.yaml: |
    parsers:
    {{- with .Values.fluentBit.config.parsers }}
      {{- . | nindent 6 }}
    {{- else }} []
    {{- end }}
