suite: credentials
templates:
  - templates/secret.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  postgresql.server: "postgresql.internal"
  postgresql.databases: ["appdb"]
  otlpEndpoint: "otlp.nr-data.net:4317"
tests:
  - it: renders a chart-owned Secret when plain username/password are given
    set:
      postgresql.username: "nr_monitor"
      postgresql.password: "s3cret"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: my-release-postgresql-otel-postgresql
      - equal:
          path: data.username
          value: bnJfbW9uaXRvcg==
      - equal:
          path: data.password
          value: czNjcmV0
  - it: renders nothing when existingSecret is given
    set:
      postgresql.existingSecret: "my-postgresql-secret"
    asserts:
      - hasDocuments:
          count: 0
