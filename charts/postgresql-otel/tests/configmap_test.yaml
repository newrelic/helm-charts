suite: configmap
templates:
  - templates/configmap.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  postgresql.server: "postgresql.internal"
  postgresql.topology: "self-hosted"
  postgresql.username: "nr_monitor"
  postgresql.password: "s3cret"
  postgresql.databases: ["appdb"]
  otlpEndpoint: "otlp.nr-data.net:4317"
tests:
  - it: fails when postgresql.topology is unset or invalid
    set:
      postgresql.topology: ""
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.topology must be one of: self-hosted, rds"
  - it: fails when otlpEndpoint has a scheme
    set:
      otlpEndpoint: "https://otlp.nr-data.net:4318"
    asserts:
      - failedTemplate:
          errorMessage: "otlpEndpoint must be a bare host:port with no scheme -- the otlp (gRPC) exporter rejects a URL, unlike mssql-otel's otlphttp. Got: \"https://otlp.nr-data.net:4318\". New Relic's US OTLP/gRPC endpoint is otlp.nr-data.net:4317"
  - it: renders the nrpostgresql receiver with env-substitution credentials, never literal ones
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: \"postgresql\\.internal:5432\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "username: \"\\$\\{env:POSTGRESQL_USERNAME\\}\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "password: \"\\$\\{env:POSTGRESQL_PASSWORD\\}\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "collection_interval: 15s"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "transport:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "s3cret"
  - it: never renders a tls block, the receiver falls back to its own defaults
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "tls:"
  - it: never renders the useOTelSemconv key, which is a collector feature gate and not a receiver config field
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "useOTelSemconv"
  - it: renders databases as a list
    set:
      postgresql.databases: ["appdb", "reporting"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "databases:\\s*\\n\\s*- appdb\\s*\\n\\s*- reporting"
  - it: omits exclude_databases on self-hosted, even with the default non-empty list
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "exclude_databases:"
  - it: renders exclude_databases on rds
    set:
      postgresql.topology: "rds"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exclude_databases:\\s*\\n\\s*- rdsadmin"
  - it: omits exclude_databases on rds when explicitly emptied
    set:
      postgresql.topology: "rds"
      postgresql.excludeDatabases: []
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "exclude_databases:"
  - it: omits explain_function_name by default, letting the receiver use its own otel.explain_statement default
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "explain_function_name:"
  - it: renders explain_function_name when set via additionalReceiverConfig, independently of the setupJob flag
    set:
      additionalReceiverConfig:
        top_query_collection:
          explain_function_name: "otel.explain_statement"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "explain_function_name: otel\\.explain_statement"
  - it: renders top_query_collection, query_sample_collection, and events from values
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "top_n_query: 200"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "nr_service_guid"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "db\\.server\\.query_sample:\\s*\\n\\s*enabled: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "db\\.server\\.top_query:\\s*\\n\\s*enabled: true"
  - it: renders resource_attributes with db.system.version right after events
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "events:\\s*\\n\\s*db\\.server\\.top_query:\\s*\\n\\s*enabled: true\\s*\\n\\s*db\\.server\\.query_sample:\\s*\\n\\s*enabled: true\\s*\\n\\s*db\\.server\\.query_plan:\\s*\\n\\s*enabled: true\\s*\\n\\s*resource_attributes:\\s*\\n\\s*db\\.system\\.version:\\s*\\n\\s*enabled: true"
  - it: renders all seven documented metrics as enabled by default
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.database\\.locks:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.deadlocks:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.function\\.calls:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.query\\.conflicts:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.sequential_scans:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.temp\\.io:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.temp_files:"
  - it: can disable an individual metric via additionalReceiverConfig
    set:
      additionalReceiverConfig:
        metrics:
          postgresql.deadlocks:
            enabled: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.deadlocks:\\s*\\n\\s*enabled: false"
  - it: renders the otlp/newrelic exporter with a bare endpoint and env-substitution api-key, never a literal one
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: \"otlp\\.nr-data\\.net:4317\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "api-key: \"\\$\\{env:NEW_RELIC_LICENSE_KEY\\}\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "retry_on_failure:"
  - it: wires the metrics and logs pipelines to the receiver, processors, and exporter
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers:\\s*\\[nrpostgresql\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exporters:\\s*\\[otlp/newrelic\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "processors:\\s*\\[batch/metrics\\]"
  - it: merges additionalReceiverConfig into the receiver block
    set:
      additionalReceiverConfig:
        connection_pool:
          max_open: 4
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "connection_pool:\\s*\\n\\s*max_open: 4"
  - it: renders the batch/metrics processor, the exporter sending_queue, and a logs pipeline on plain batch
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "batch/metrics:\\s*\\n\\s*send_batch_size: 8192\\s*\\n\\s*send_batch_max_size: 8192\\s*\\n\\s*timeout: 10s"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sending_queue:\\s*\\n\\s*enabled: true\\s*\\n\\s*sizer: bytes\\s*\\n\\s*queue_size: 100_000_000\\s*\\n\\s*num_consumers: 10\\s*\\n\\s*batch:\\s*\\n\\s*sizer: bytes\\s*\\n\\s*max_size: 1_000_000\\s*\\n\\s*min_size: 0\\s*\\n\\s*flush_timeout: 5s"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "logs:\\s*\\n\\s*receivers: \\[nrpostgresql\\]\\s*\\n\\s*processors: \\[batch\\]"
