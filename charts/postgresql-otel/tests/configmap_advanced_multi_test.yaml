suite: configmap (postgresqlMulti configProfile)
templates:
  - templates/configmap-multi.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  postgresqlMulti.enabled: true
  postgresqlMulti.topology: "self-hosted"
  postgresqlMulti.instances:
    - name: db1
      server: "host1.example.internal"
      existingSecret: "db1-creds"
      databases: ["appdb1"]
    - name: db2
      server: "host2.example.internal"
      existingSecret: "db2-creds"
      databases: ["appdb2"]
  otlpEndpoint: "otlp.nr-data.net:4317"
tests:
  - it: fails when postgresqlMulti.configProfile is empty
    set:
      postgresqlMulti.configProfile: ""
    asserts:
      - failedTemplate:
          errorMessage: "postgresqlMulti.configProfile must be one of: basic, advanced"
  - it: fails when postgresqlMulti.configProfile has the wrong case
    set:
      postgresqlMulti.configProfile: "Advanced"
    asserts:
      - failedTemplate:
          errorMessage: "postgresqlMulti.configProfile must be one of: basic, advanced"
  - it: defaults to basic
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.wal\\.delay:"
  - it: renders the advanced catalog on the first instance only
    set:
      postgresqlMulti.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.wal\\.delay:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "(?s)postgresql\\.wal\\.delay:.*postgresql\\.wal\\.delay:"
  - it: renders the advanced catalog for rds and keeps exclude_databases
    set:
      postgresqlMulti.topology: rds
      postgresqlMulti.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.wal\\.delay:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exclude_databases:\\n\\s*- rdsadmin"
  - it: ignores postgresql.configProfile in multi mode
    set:
      postgresql.configProfile: advanced
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "postgresql\\.wal\\.delay:"
