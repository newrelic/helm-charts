suite: setup job
templates:
  - templates/setup-job.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  postgresql.server: "postgresql.internal"
  postgresql.port: 5432
  postgresql.topology: "self-hosted"
  postgresql.username: "nr_monitor"
  postgresql.password: "s3cret"
  postgresql.databases: ["appdb"]
  otlpEndpoint: "otlp.nr-data.net:4317"
  setupJob.postgresAdmin.existingSecret: "admin-secret"
  setupJob.image.repository: "postgres"
  setupJob.image.tag: "16"
tests:
  - it: renders nothing when setupJob.enabled is false
    set:
      setupJob.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: fails when setupJob.enabled is true and postgresAdmin.existingSecret is unset
    set:
      setupJob.enabled: true
      setupJob.postgresAdmin.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "setupJob.postgresAdmin.existingSecret is required when setupJob.enabled is true"
  - it: fails when setupJob.enabled is true and no image is given
    set:
      setupJob.enabled: true
      setupJob.image.repository: ""
      setupJob.image.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: "setupJob.image.repository and setupJob.image.tag are required when setupJob.enabled is true -- this chart ships no default psql-client image, see README"
  - it: has pre-install/pre-upgrade hook annotations with the documented delete policy
    set:
      setupJob.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
  - it: wires admin and monitoring credentials as env vars, never as CLI args
    set:
      setupJob.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0]
          value:
            name: PGUSER
            valueFrom:
              secretKeyRef:
                name: admin-secret
                key: username
      - equal:
          path: spec.template.spec.containers[0].env[1]
          value:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: admin-secret
                key: password
      - equal:
          path: spec.template.spec.containers[0].env[2]
          value:
            name: PG_MONITOR_USERNAME
            valueFrom:
              secretKeyRef:
                name: my-release-postgresql-otel-postgresql
                key: username
      - equal:
          path: spec.template.spec.containers[0].env[3]
          value:
            name: PG_MONITOR_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-release-postgresql-otel-postgresql
                key: password
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "s3cret"
  - it: uses the configured psql image and does not restart on failure
    set:
      setupJob.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: postgres:16
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
  - it: creates the role conditionally via format+gexec, passing credentials as psql variables
    set:
      setupJob.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "CREATE USER %I WITH LOGIN PASSWORD %L', :'monitor_user', :'monitor_password'"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "WHERE NOT EXISTS \\(SELECT FROM pg_roles WHERE rolname = :'monitor_user'\\)"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "ALTER ROLE %I INHERIT"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "-v monitor_user=\"\\$PG_MONITOR_USERNAME\""
  - it: renders the per-database grants once for a single database
    set:
      setupJob.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "CREATE SCHEMA IF NOT EXISTS otel;"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "GRANT pg_monitor TO :\"monitor_user\";"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "-d \"appdb\""
  - it: renders the per-database grants once per database when several are given
    set:
      setupJob.enabled: true
      postgresql.databases: ["appdb", "reporting"]
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "-d \"appdb\""
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "-d \"reporting\""
  - it: omits the explain-permissions and pgvector blocks by default
    set:
      setupJob.enabled: true
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "otel\\.explain_statement"
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "CREATE EXTENSION IF NOT EXISTS vector;"
  - it: adds the explain-permissions function and grant when enableExplainPermissions is true
    set:
      setupJob.enabled: true
      setupJob.enableExplainPermissions: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "CREATE OR REPLACE FUNCTION otel\\.explain_statement\\(l_query text\\)"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "SECURITY DEFINER"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "GRANT EXECUTE ON FUNCTION otel\\.explain_statement\\(text\\) TO :\"monitor_user\";"
  - it: adds pgvector when enablePgvector is true
    set:
      setupJob.enabled: true
      setupJob.enablePgvector: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "CREATE EXTENSION IF NOT EXISTS vector;"
