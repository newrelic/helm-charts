image:
  repository: newrelic/nrdot-collector
  tag: "2.5.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

postgresql:
  # -- Required. One of: self-hosted, rds. Documentation/validation only -- no rendered difference.
  topology: ""
  # -- Required. PostgreSQL host/endpoint (no port).
  server: ""
  # -- PostgreSQL port.
  port: 5432
  # -- Plain-value monitoring username. Ignored if existingSecret is set.
  username: ""
  # -- Plain-value monitoring password. Ignored if existingSecret is set.
  password: ""
  # -- Name of a pre-existing Secret with keys `username` and `password`. Wins over the plain values above if set.
  existingSecret: ""
  # -- Required, non-empty. Databases to monitor. PostgreSQL has no monitor-all-databases mode, so at least one name is required.
  databases: []
  # -- Databases to exclude from cluster-wide top-query/query-sample scans. Only rendered when topology=rds -- rdsadmin is unreachable by the monitoring user there. Ignored on self-hosted, where that database doesn't exist.
  excludeDatabases:
    - rdsadmin
  # -- How often the receiver scrapes PostgreSQL.
  collectionInterval: 15s

postgresqlMulti:
  # -- Enables multi-instance mode: one release monitors every entry in postgresqlMulti.instances from a single collector pod.
  # Mutually exclusive with the postgresql.* single-instance block above -- do not set postgresql.server when this is true.
  enabled: false
  # -- Required when enabled. One of: self-hosted, rds. Kept for parity with postgresql.topology -- still validation-only, no rendered effect.
  topology: ""
  # -- List of PostgreSQL instances to monitor from this one release. Each entry requires: name (unique), server, existingSecret,
  # databases (non-empty list of database names on that instance -- same requirement as postgresql.databases today, just per-instance).
  # port defaults to 5432. postgresAdmin.existingSecret is required per entry only when setupJob.enabled is true.
  # Scrape-behavior settings (collectionInterval, events, topQueryCollection, querySampleCollection, metrics, excludeDatabases) are
  # NOT configurable per entry or at the postgresqlMulti level -- they're the same fixed defaults used in single-instance mode
  # too (see postgresql-otel.multi.receiverDefaults in _helpers.tpl). Use additionalReceiverConfig to override any of them if you need to.
  instances: []

# -- Required. New Relic OTLP/gRPC endpoint for the account's region, bare host:port with NO scheme, e.g. otlp.nr-data.net:4317
otlpEndpoint: ""

# -- Plain-value New Relic license key. Can also be set as global.licenseKey.
licenseKey: ""
# -- Name of a pre-existing Secret holding the license key. Can also be set as global.customSecretName.
customSecretName: ""
# -- Key inside customSecretName that holds the license key. Can also be set as global.customSecretLicenseKey.
customSecretLicenseKey: ""

# -- Escape hatch merged into the nrpostgresql receiver block.
additionalReceiverConfig: {}

setupJob:
  # -- If true, a Helm hook Job creates the monitoring user, per-database grants, and pg_stat_statements before install/upgrade.
  enabled: false
  image:
    # -- psql-capable image. No default -- unlike mysql-otel's mysql:8.4, no free, actively-maintained psql-client image has been verified for this chart yet. postgres:16 is a candidate; see README.
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  postgresAdmin:
    # -- Required when setupJob.enabled is true. Name of a pre-existing Secret with keys `username` and `password`. No plain-value path. Must be a superuser (self-hosted) or rds_superuser-equivalent (RDS) able to CREATE USER, CREATE SCHEMA, and CREATE EXTENSION.
    existingSecret: ""
  # -- Creates the otel.explain_statement SECURITY DEFINER function and grants EXECUTE on it -- the exact name the receiver's own top_query_collection.explain_function_name default already looks for. Set to false to skip it. Set additionalReceiverConfig.top_query_collection.explain_function_name to point at a differently-named function instead.
  enableExplainPermissions: true
  # -- Also creates the pgvector extension in each monitored database, for vector metrics. Optional per the doc.
  enablePgvector: false

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
