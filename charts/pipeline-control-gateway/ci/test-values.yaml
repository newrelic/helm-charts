global:
  cluster: sa-cluster
  licenseKey: 1234567890abcdef1234567890abcdef12345678

# The CI license key is a dummy value that cannot pass PCG's preconnect
# validation (NR-577441). Skip the functional license-key check so the chart
# is testable in CI. Older images ignore this unknown env var harmlessly.
deployment:
  envs:
    - name: PCG_SKIP_PRECONNECT_VALIDATION
      value: "true"

# The WAL feature provisions a per-pod ephemeral EBS volume with storageClass
# `gp3-wal`, which only exists on a real EBS-backed cluster. In CI (minikube)
# that PVC never binds and `ct install` times out, so disable WAL here — its
# templating is covered by lint/`helm template`, not the install smoke test.
wal:
  enabled: false
