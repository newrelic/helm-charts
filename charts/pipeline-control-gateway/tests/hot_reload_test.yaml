suite: config hot reload (fluxless customConfigMap)
templates:
  - templates/deployment.yaml
  - templates/daemonset.yaml
  # Loaded for the checksum/config annotation's include.
  - templates/deployment-configmap.yaml
  - templates/daemonset-configmap.yaml
release:
  name: pcg
  namespace: newrelic
set:
  cluster: test-cluster
  licenseKey: 1234567890abcdef1234567890abcdef12345678
tests:
  - it: renders only the gateway container for a Deployment with a customConfigMap
    template: templates/deployment.yaml
    set:
      deployment.customConfigMap: pcg-custom-config
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: pipeline-control-gateway
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: pcg-custom-config
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath

  - it: renders only the gateway container for a DaemonSet with a customConfigMap
    template: templates/daemonset.yaml
    set:
      daemonset.enabled: true
      daemonset.customConfigMap: pcg-custom-config
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: pipeline-control-gateway
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: pcg-custom-config
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath

  - it: fails for a release image older than the first hot-reload release
    template: templates/deployment.yaml
    set:
      deployment.customConfigMap: pcg-custom-config
      image.tag: "2.5.0"
    asserts:
      - failedTemplate:
          errorPattern: 'image.tag "2.5.0" does not reload config changes in place'

  - it: fails for an old release image on a DaemonSet
    template: templates/daemonset.yaml
    set:
      daemonset.enabled: true
      daemonset.customConfigMap: pcg-custom-config
      image.tag: "v2.2.0"
    asserts:
      - failedTemplate:
          errorPattern: 'image.tag "2.2.0" does not reload config changes in place'

  - it: accepts the first hot-reload release image
    template: templates/deployment.yaml
    set:
      deployment.customConfigMap: pcg-custom-config
      image.tag: "2.6.0"
    asserts:
      - notFailedTemplate: {}

  - it: does not check custom or pre-release image tags
    template: templates/deployment.yaml
    set:
      deployment.customConfigMap: pcg-custom-config
      image.tag: "2.5.0-pr-612"
    asserts:
      - notFailedTemplate: {}

  - it: does not check the image without a customConfigMap
    template: templates/deployment.yaml
    set:
      image.tag: "2.5.0"
    asserts:
      - notFailedTemplate: {}
