{{- if and .Values.rbac.create (include "nrKubernetesOtel.hotReload.watchesAPI" .) }}
# Read-only access to the one ConfigMap PCG reloads, so it can follow it through the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "newrelic.common.naming.fullname" . }}-config-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newrelic.common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ include "nrKubernetesOtel.hotReload.watchedConfigMap" . | quote }}
    verbs: ["get", "list", "watch"]
{{- end }}
