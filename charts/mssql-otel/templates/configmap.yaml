{{- if not .Values.mssqlMulti.enabled }}
{{- include "mssql-otel.validate.topology" . -}}
{{- include "mssql-otel.validate.otlpEndpoint" . -}}
{{- $receiver := dict -}}
{{- $receiver = mergeOverwrite $receiver (include "mssql-otel.receiver.defaults" . | fromYaml) -}}
{{- $receiver = mergeOverwrite $receiver (dict
      "server" .Values.mssql.server
      "port" (.Values.mssql.port | int)
      "username" "${env:MSSQL_USERNAME}"
      "password" "${env:MSSQL_PASSWORD}"
      "collection_interval" .Values.mssql.collectionInterval
) -}}
{{- $receiver = mergeOverwrite $receiver (.Values.additionalReceiverConfig | default dict) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mssql-otel.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mssql-otel.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      nrsqlserver:
{{- include "mssql-otel.renderReceiver" (dict "receiver" $receiver) }}
    processors:
      memory_limiter:
        check_interval: ${env:NR_MEM_LIMITER_CHECK_INTERVAL:-1s}
        limit_mib: ${env:NR_MEM_LIMITER_LIMIT_MIB:-200}
        spike_limit_mib: ${env:NR_MEM_LIMITER_SPIKE_MIB:-50}
    exporters:
      otlp:
        endpoint: {{ .Values.otlpEndpoint }}
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}
        tls:
          insecure: false
        compression: gzip
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: 100_000_000
          num_consumers: 10
          batch:
            sizer: bytes
            max_size: 1_000_000
            min_size: 0
            flush_timeout: 5s
    service:
      telemetry:
        metrics:
          level: none
      pipelines:
        metrics:
          receivers: [nrsqlserver]
          processors: [memory_limiter]
          exporters: [otlp]
        logs:
          receivers: [nrsqlserver]
          processors: [memory_limiter]
          exporters: [otlp]
{{- end }}
