suite: configmap (mssqlMulti)
templates:
  - templates/configmap-multi.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  mssqlMulti.enabled: true
  mssqlMulti.topology: "self-hosted"
  mssqlMulti.databases:
    - name: db1
      server: "host1.example.internal"
      existingSecret: "db1-creds"
    - name: db2
      server: "host2.example.internal"
      existingSecret: "db2-creds"
  otlpEndpoint: "https://otlp.nr-data.net:4318"
tests:
  - it: fails when mssqlMulti.topology is unset or invalid
    set:
      mssqlMulti.topology: ""
    asserts:
      - failedTemplate:
          errorMessage: "mssqlMulti.topology must be one of: self-hosted, rds"
  - it: fails when mssqlMulti.databases is empty
    set:
      mssqlMulti.databases: []
    asserts:
      - failedTemplate:
          errorMessage: "mssqlMulti.databases must contain at least one entry when mssqlMulti.enabled is true"
  - it: fails when a database entry is missing a required field
    set:
      mssqlMulti.databases:
        - name: db1
          existingSecret: "db1-creds"
    asserts:
      - failedTemplate:
          errorMessage: "mssqlMulti.databases[0].server is required"
  - it: fails when two entries share the same name
    set:
      mssqlMulti.databases:
        - name: db1
          server: "host1"
          existingSecret: "db1-creds"
        - name: db1
          server: "host2"
          existingSecret: "db2-creds"
    asserts:
      - failedTemplate:
          errorMessage: "mssqlMulti.databases[1].name \"db1\" duplicates an earlier entry's name"
  - it: fails when mssql.server is also set (mixed-mode guard)
    set:
      mssql.server: "legacy.example.internal"
    asserts:
      - failedTemplate:
          errorMessage: "mssqlMulti.enabled and mssql.server are mutually exclusive -- use one mode or the other in a single release"
  - it: renders the first entry as the full receiver, anchored, with its own identity fields
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "nrsqlserver/db1: &nrsqlserver-common\\n\\s*collection_interval: 15s"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "username: \\$\\{env:MSSQL_USERNAME_DB1\\}"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "server: host1\\.example\\.internal"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "port: 1433"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "db1-creds|db2-creds"
  - it: renders every subsequent entry as a merge-key override, not a full duplicate
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "nrsqlserver/db2:\\n\\s*<<: \\*nrsqlserver-common\\n\\s*username: \\$\\{env:MSSQL_USERNAME_DB2\\}"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "server: host2\\.example\\.internal"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "&nrsqlserver-common[\\s\\S]*&nrsqlserver-common"
  - it: renders the shared scrape-behavior config once (on the anchor)
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "top_query_collection:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.database\\.count:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "collect_full_query_text: true"
  - it: shares one exporter and lists every receiver in one combined pipeline pair
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers: \\[nrsqlserver/db1, nrsqlserver/db2\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exporters:\\n\\s*otlp:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "otlp:[\\s\\S]*otlp:"
  - it: does not use a YAML anchor/merge key when there's only one database entry
    set:
      mssqlMulti.databases:
        - name: db1
          server: "host1.example.internal"
          existingSecret: "db1-creds"
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "&nrsqlserver-common"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "<<: \\*nrsqlserver-common"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "nrsqlserver/db1:\\n\\s*collection_interval: 15s"
  - it: merges additionalReceiverConfig into the shared block
    set:
      additionalReceiverConfig:
        events:
          db.server.query_sample:
            enabled: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "db\\.server\\.query_sample:\\n\\s*enabled: false"
