suite: setup job configmap (mssqlMulti)
templates:
  - templates/setup-configmap.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  mssqlMulti.enabled: true
  mssqlMulti.topology: "self-hosted"
  mssqlMulti.databases:
    - name: db1
      server: "host1"
      existingSecret: "db1-creds"
      sqlAdmin:
        existingSecret: "db1-admin"
    - name: db2
      server: "host2"
      existingSecret: "db2-creds"
      sqlAdmin:
        existingSecret: "db2-admin"
  otlpEndpoint: "otlp.nr-data.net:4317"
tests:
  - it: renders nothing when setupJob.enabled is false
    set:
      setupJob.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders the same grants.sql once when setupJob.enabled is true, validating per-entry sqlAdmin
    set:
      setupJob.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isNotEmpty:
          path: data["grants.sql"]
  - it: fails using the multi-instance validator when an entry is missing sqlAdmin.existingSecret
    set:
      setupJob.enabled: true
      mssqlMulti.databases:
        - name: db1
          server: "host1"
          existingSecret: "db1-creds"
    asserts:
      - failedTemplate:
          errorMessage: "mssqlMulti.databases[0].sqlAdmin.existingSecret is required when setupJob.enabled is true"
