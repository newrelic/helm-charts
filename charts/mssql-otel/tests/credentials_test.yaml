suite: credentials
templates:
  - templates/secret.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  mssql.server: "sql.internal"
  otlpEndpoint: "otlp.nr-data.net:4317"
tests:
  - it: renders a chart-owned Secret when plain username/password are given
    set:
      mssql.username: "nr_monitor"
      mssql.password: "s3cret"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: my-release-mssql-otel-mssql
      - equal:
          path: data.username
          value: bnJfbW9uaXRvcg==
      - equal:
          path: data.password
          value: czNjcmV0
  - it: renders nothing when existingSecret is given
    set:
      mssql.existingSecret: "my-mssql-secret"
    asserts:
      - hasDocuments:
          count: 0
