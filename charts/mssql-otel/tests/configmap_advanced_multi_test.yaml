suite: configmap (mssqlMulti configProfile)
templates:
  - templates/configmap-multi.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  mssqlMulti.enabled: true
  mssqlMulti.topology: "self-hosted"
  mssqlMulti.databases:
    - name: db1
      server: "host1.example.internal"
      existingSecret: "db1-creds"
    - name: db2
      server: "host2.example.internal"
      existingSecret: "db2-creds"
  otlpEndpoint: "https://otlp.nr-data.net:4318"
tests:
  - it: fails when mssqlMulti.configProfile is empty
    set:
      mssqlMulti.configProfile: ""
    asserts:
      - failedTemplate:
          errorMessage: "mssqlMulti.configProfile must be one of: basic, advanced"
  - it: fails when mssqlMulti.configProfile has the wrong case
    set:
      mssqlMulti.configProfile: "Advanced"
    asserts:
      - failedTemplate:
          errorMessage: "mssqlMulti.configProfile must be one of: basic, advanced"
  - it: defaults to basic
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.lock\\.wait\\.count:"
  - it: renders the advanced catalog on the first database only
    set:
      mssqlMulti.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.lock\\.wait\\.count:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "(?s)sqlserver\\.lock\\.wait\\.count:.*sqlserver\\.lock\\.wait\\.count:"
  - it: includes execution.errors for self-hosted
    set:
      mssqlMulti.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.database\\.execution\\.errors:"
  - it: omits execution.errors for rds
    set:
      mssqlMulti.topology: rds
      mssqlMulti.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.lock\\.wait\\.count:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.database\\.execution\\.errors:"
  - it: ignores mssql.configProfile in multi mode
    set:
      mssql.configProfile: advanced
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.lock\\.wait\\.count:"
