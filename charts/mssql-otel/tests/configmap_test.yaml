suite: configmap
templates:
  - templates/configmap.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  mssql.server: "sql.internal"
  mssql.topology: "self-hosted"
  mssql.username: "nr_monitor"
  mssql.password: "s3cret"
  mssql.collectionInterval: "30s"
  otlpEndpoint: "https://otlp.nr-data.net:4318"
tests:
  - it: fails when mssql.topology is unset or invalid
    set:
      mssql.topology: ""
    asserts:
      - failedTemplate:
          errorMessage: "mssql.topology must be one of: self-hosted, rds"
  - it: fails when otlpEndpoint has no scheme
    set:
      otlpEndpoint: "otlp.nr-data.net:4318"
    asserts:
      - failedTemplate:
          errorMessage: 'otlpEndpoint must include a scheme (http:// or https://). Got: "otlp.nr-data.net:4318". New Relic''s US OTLP/HTTP endpoint is https://otlp.nr-data.net:4318'
  - it: renders the nrsqlserver receiver's discrete connection fields with env-substitution credentials, never literal ones
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "server: sql\\.internal"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "port: 1433"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "username: \\$\\{env:MSSQL_USERNAME\\}"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "password: \\$\\{env:MSSQL_PASSWORD\\}"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "collection_interval: 30s"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "s3cret"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "datasource:"
  - it: renders receiver fields in the documented order -- collection_interval, username, password, server, port, then metrics before events
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "collection_interval:.*\\n\\s*username:.*\\n\\s*password:.*\\n\\s*server:.*\\n\\s*port:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "port: 1433\\n\\s*metrics:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.memory\\.area:\\n\\s*enabled: true\\n\\s*events:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "top_query_collection:\\n\\s*lookback_time:.*\\n\\s*max_query_sample_count:.*\\n\\s*top_query_count:.*\\n\\s*collection_interval:"
  - it: renders the otlp exporter with an env-substitution api-key, never a literal one, no retry_on_failure
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: https://otlp\\.nr-data\\.net:4318"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "retry_on_failure:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "tls:\\n\\s*insecure: false"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "telemetry:\\n\\s*metrics:\\n\\s*level: none"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "api-key: \\$\\{env:NEW_RELIC_LICENSE_KEY\\}"
  - it: wires the metrics and logs pipelines to the receiver, processors, and exporter
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers:\\s*\\[nrsqlserver\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exporters:\\s*\\[otlp\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "processors:\\s*\\[memory_limiter, batch\\]"
  - it: renders the standard-configuration metrics/events defaults
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.database\\.count:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.memory\\.area:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "db\\.server\\.query_sample:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "collect_full_query_text: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "nr_service_guid"
  - it: same topology renders identically for self-hosted and rds
    set:
      mssql.topology: "rds"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.database\\.count:"
  - it: merges additionalReceiverConfig into the receiver block
    set:
      additionalReceiverConfig:
        max_concurrent_queries: 10
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "max_concurrent_queries: 10"
