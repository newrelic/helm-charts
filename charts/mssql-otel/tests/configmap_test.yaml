suite: configmap
templates:
  - templates/configmap.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  mssql.server: "sql.internal"
  mssql.topology: "self-hosted"
  mssql.username: "nr_monitor"
  mssql.password: "s3cret"
  mssql.collectionInterval: "30s"
  otlpEndpoint: "otlp.nr-data.net:4317"
tests:
  - it: fails when mssql.topology is unset or invalid
    set:
      mssql.topology: ""
    asserts:
      - failedTemplate:
          errorMessage: "mssql.topology must be one of: self-hosted, rds"
  - it: renders the nrsqlserver receiver's datasource with env-substitution credentials, never literal ones
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "datasource: server=sql\\.internal;user id=\\$\\{env:MSSQL_USERNAME\\};password=\\$\\{env:MSSQL_PASSWORD\\};port=1433;encrypt=false;trustservercertificate=false"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "collection_interval: 30s"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "s3cret"
  - it: sets encrypt and trustservercertificate on the datasource from mssql.tls
    set:
      mssql.tls.enabled: true
      mssql.tls.trustServerCertificate: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "encrypt=true;trustservercertificate=true"
  - it: renders the otlphttp exporter with an env-substitution api-key, never a literal one, plus retry_on_failure
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: \"otlp\\.nr-data\\.net:4317\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "api-key: \"\\$\\{env:NEW_RELIC_LICENSE_KEY\\}\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "retry_on_failure:"
  - it: wires the metrics and logs pipelines to the receiver, processors, and exporter
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers:\\s*\\[nrsqlserver\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exporters:\\s*\\[otlphttp\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "processors:\\s*\\[memory_limiter, batch\\]"
  - it: renders the standard-configuration metrics/events defaults
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.database\\.count:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.memory\\.area:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "db\\.server\\.query_sample:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "collect_full_query_text: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "nr_service_guid"
  - it: same topology renders identically for self-hosted and rds
    set:
      mssql.topology: "rds"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.database\\.count:"
  - it: merges additionalReceiverConfig into the receiver block
    set:
      additionalReceiverConfig:
        max_concurrent_queries: 10
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "max_concurrent_queries: 10"
