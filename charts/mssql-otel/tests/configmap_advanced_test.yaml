suite: configmap (configProfile)
templates:
  - templates/configmap.yaml
release:
  name: my-release
  namespace: my-namespace
set:
  mssql.server: "sql.internal"
  mssql.topology: "self-hosted"
  mssql.username: "nr_monitor"
  mssql.password: "s3cret"
  otlpEndpoint: "https://otlp.nr-data.net:4318"
tests:
  - it: fails when mssql.configProfile is empty
    set:
      mssql.configProfile: ""
    asserts:
      - failedTemplate:
          errorMessage: "mssql.configProfile must be one of: basic, advanced"
  - it: fails when mssql.configProfile has the wrong case
    set:
      mssql.configProfile: "Advanced"
    asserts:
      - failedTemplate:
          errorMessage: "mssql.configProfile must be one of: basic, advanced"
  - it: defaults to basic, which has no advanced-only metrics
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.lock\\.wait\\.count:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.database\\.execution\\.errors:"
  - it: renders the full catalog for self-hosted, including execution.errors and the basic metrics
    set:
      mssql.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.lock\\.wait\\.count:\\n\\s*enabled: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.database\\.execution\\.errors:\\n\\s*enabled: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.processes\\.blocked:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.database\\.count:"
  - it: renders the full catalog for rds without execution.errors
    set:
      mssql.topology: rds
      mssql.configProfile: advanced
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.lock\\.wait\\.count:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.database\\.execution\\.errors:"
  - it: additionalReceiverConfig can disable an advanced-only metric
    set:
      mssql.configProfile: advanced
      additionalReceiverConfig:
        metrics:
          sqlserver.lock.wait.count:
            enabled: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.lock\\.wait\\.count:\\n\\s*enabled: false"
  - it: ignores mssqlMulti.configProfile in single mode
    set:
      mssqlMulti.configProfile: advanced
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "sqlserver\\.lock\\.wait\\.count:"
