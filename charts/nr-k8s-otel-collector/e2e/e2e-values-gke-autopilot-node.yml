# GKE Autopilot e2e — NODE variant (host namespaces: node-scoped host layer).
# atp variant plus daemonset.hostPID/hostNetwork=true. hostNetwork re-scopes the network scraper to
# the node interfaces (node system.network.*); hostPID lets the process scraper see node-wide
# processes (partial process.cpu.time). Needs the hostnet-on CR, which adds the
# autogke-disallow-hostnamespaces exemption on top of the hostpath one.
provider: GKE_AUTOPILOT
gkeAutopilotAllowlist: true
enable_atp: true
daemonset:
  hostPID: true
  hostNetwork: true
