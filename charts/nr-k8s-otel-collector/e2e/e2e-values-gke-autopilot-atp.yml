# GKE Autopilot e2e — ATP variant (filesystem + Adaptive Telemetry process metrics).
# filesystem variant plus enable_atp=true, which turns on the process metrics pipeline. On GKE
# Autopilot this needs the host-fs mount (/hostfs/proc), so it runs on top of gkeAutopilotAllowlist
# and the same hostnet-off CR (whose ATP write mount /var/lib/nrdot-collector is
# pre-listed). Adds the process.* metric family.
provider: GKE_AUTOPILOT
gkeAutopilotAllowlist: true
enable_atp: true
